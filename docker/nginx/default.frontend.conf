server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10M;

    # El contenedor está detrás de un proxy que termina HTTPS y le reenvía en
    # HTTP simple; sin esto, los 301 automáticos de nginx (ej. /contratos ->
    # /contratos/) se arman como http://, lo que rompe las previews de
    # WhatsApp/Facebook/Twitter al no seguir un downgrade HTTPS->HTTP.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:9000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
